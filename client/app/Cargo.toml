[package]
name = "telinha"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg", "image", "gif", "webp"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
regex = "1.13.1"
rfd = "0.18.0"
serde_json = "1.0.154"
telinha-core = { version = "0.1.0", path = "../core" }
telinha-voice = { version = "0.1.0", path = "../voice" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
webp = "0.3.1"
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
libwebrtc = "0.4.1"
telinha-voice = { path = "../voice" }
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.34"
