name: ci

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-release, linux-clang-release]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    name: linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-asan, linux-tsan]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  windows:
    name: windows ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [msvc-debug, msvc-debug-webrtc, msvc-release]
    steps:
      - uses: actions/checkout@v4

      - name: Cache the pinned libwebrtc package
        uses: actions/cache@v4
        with:
          path: .deps
          key: libwebrtc-${{ runner.os }}-${{ hashFiles('src/transport/cmake/TelinhaWebRTC.cmake') }}

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -products * -all -format value -property displayName

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  package:
    name: windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the pinned libwebrtc package
        uses: actions/cache@v4
        with:
          path: .deps
          key: libwebrtc-${{ runner.os }}-${{ hashFiles('src/transport/cmake/TelinhaWebRTC.cmake') }}

      - name: Configure
        run: cmake --preset msvc-release

      - name: Build
        run: cmake --build --preset msvc-release

      - name: Stage artifact
        shell: pwsh
        run: |
          cmake --install build/msvc-release --config Release --prefix staging --component runtime
          cmake --install build/msvc-release --config Release --prefix staging-symbols --component symbols
          Get-ChildItem staging | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: telinha-windows-x64
          path: staging/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: telinha-windows-x64-symbols
          path: staging-symbols/
          if-no-files-found: ignore

  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          mapfile -t files < <(git ls-files '*.hpp' '*.cpp')
          clang-format-18 --dry-run --Werror "${files[@]}"
