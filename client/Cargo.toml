[workspace]
resolver = "3"
members = ["core", "app", "voice"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# The vendored copy adds an H264 decoder through Windows Media Foundation.
[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
