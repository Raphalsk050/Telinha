<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telinha — esboço</title>
  <link id="styles" rel="stylesheet" href="styles.css">
</head>
<body data-theme="gray">
  <div id="app"></div>

  <!-- Barra do esboço: troca de tela e tema. Não faz parte do app. -->
  <div id="dev">
    <select id="dev-view" title="Tela">
      <option value="chat">Servidor · chat</option>
      <option value="call">Servidor · sala de voz</option>
      <option value="home">Início · contatos</option>
      <option value="settings">Configurações</option>
    </select>
    <select id="dev-theme" title="Tema">
      <option value="gray">Cinza</option>
      <option value="dark">Escuro</option>
      <option value="onyx">Ônix</option>
      <option value="light">Claro</option>
    </select>
    <label title="Lista de membros"><input id="dev-members" type="checkbox" checked> membros</label>
    <span id="dev-live" title="Recarrega sozinho quando um arquivo muda">●</span>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="live.js"></script>
</body>
</html>
