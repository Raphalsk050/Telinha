[package]
name = "telinha-voice"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
futures-util = "0.3.34"
libwebrtc = "0.4.1"
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm", "flac", "aac", "isomp4"] }
telinha-core = { version = "0.1.0", path = "../core" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1.29.2", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Media_KernelStreaming", "Win32_Media_MediaFoundation", "Win32_System_Com"] }

[dev-dependencies]
telinha-core = { path = "../core" }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }
