name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-release, linux-clang-release]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sanitizers:
    name: linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-asan, linux-tsan]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  windows:
    name: windows ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [msvc-debug, msvc-debug-webrtc, msvc-release]
    steps:
      - uses: actions/checkout@v4

      - name: Cache the pinned libwebrtc package
        uses: actions/cache@v4
        with:
          path: .deps
          key: libwebrtc-${{ runner.os }}-${{ hashFiles('src/transport/cmake/TelinhaWebRTC.cmake') }}

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -products * -all -format value -property displayName

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  package:
    name: windows package
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Cache the pinned libwebrtc package
        uses: actions/cache@v4
        with:
          path: .deps
          key: libwebrtc-${{ runner.os }}-${{ hashFiles('src/transport/cmake/TelinhaWebRTC.cmake') }}

      - name: Configure
        run: cmake --preset msvc-release

      - name: Build
        run: cmake --build --preset msvc-release

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          $binaries = Get-ChildItem -Path build/msvc-release -Recurse -Include *.exe, *.pdb -File |
            Where-Object { $_.FullName -notmatch 'CMakeFiles' }
          if ($binaries) {
            $binaries | Copy-Item -Destination staging
            Get-ChildItem staging | Select-Object Name, Length
          } else {
            Write-Host "no executables produced yet"
            New-Item -ItemType File -Path staging/EMPTY | Out-Null
          }

      - uses: actions/upload-artifact@v4
        with:
          name: telinha-windows-x64
          path: staging/
          if-no-files-found: error

      # The app is the Rust one in client/, with the engine built above inside it.
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/target
          key: rust-${{ runner.os }}-${{ hashFiles('client/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Test the app core
        working-directory: client
        run: cargo test --locked -p telinha-core

      - name: Package the app
        shell: pwsh
        env:
          TELINHA_UPDATES: '1'
        run: |
          $engine = Get-ChildItem build/msvc-release -Recurse -Filter telinha.exe -File |
            Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
          if (-not $engine) { throw 'the engine telinha.exe was not built' }
          $env:TELINHA_ENGINE = $engine.FullName
          Push-Location client
          cargo build --release --locked -p telinha
          if ($LASTEXITCODE -ne 0) { throw 'the app did not build' }
          Pop-Location
          New-Item -ItemType Directory -Force -Path client/dist | Out-Null
          Copy-Item client/target/release/telinha.exe client/dist/Telinha.exe
          Get-Item client/dist/Telinha.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: telinha-app-windows-x64
          path: client/dist/Telinha.exe
          if-no-files-found: error
          compression-level: 0

  plan:
    name: release plan
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the release notes and the version
        id: plan
        run: node desktop/scripts/release.js plan >> "$GITHUB_OUTPUT"

  # Publishes version.json as a release once it is above the last one and everything else passed.
  release:
    name: release
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.plan.outputs.release == 'true'
    needs: [plan, linux, sanitizers, windows, package, format]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: telinha-app-windows-x64
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: >
          gh release create "v$VERSION" dist/Telinha.exe
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Telinha $VERSION" --notes-file RELEASE_NOTES.md

  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          mapfile -t files < <(git ls-files '*.hpp' '*.cpp' ':!client/')
          clang-format-18 --dry-run --Werror "${files[@]}"
