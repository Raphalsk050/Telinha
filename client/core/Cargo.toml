[package]
name = "telinha-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.4"
aes-gcm = "0.11.1"
base64 = "0.23.1"
ctr = "0.10.1"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
indexmap = { version = "2.14.2", features = ["serde"] }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
rumqttc = { version = "0.25.1", features = ["websocket"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "fs", "net"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3.27.0"
